[options]
; Basic settings
;admin_passwd = your_master_password_here
db_host = False
db_port = False
db_user = odoo
db_password = False

; Directories
addons_path = /opt/odoo/odoo-18.0/addons
data_dir = /opt/odoo/.local/share/Odoo

; Server settings
logfile = /var/log/odoo/odoo.log
logrotate = True
xmlrpc_port = 8069
limit_time_cpu = 600
limit_time_real = 1200

; Memory limits (optimized for 2GB RAM)
;limit_memory_soft = 536870912     ; 512 MB
;limit_memory_hard = 1073741824    ; 1024 MB

; Workers setup for 1 CPU
;workers = 0                       ; Use threaded mode, not multi-process

; Security
proxy_mode = True
